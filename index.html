<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtCoder & OMC Rating Estimator</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-sub: #666666;
            --border-color: #e5e7eb;
            --atcoder-blue: #0000ff;
            --omc-green: #008000;
            --accent-color: #111111;
            --accent-hover: #333333;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        /* ヘルパー・ロゴ部分のデザイン */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .badges {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .badge-atcoder {
            background: rgba(0, 0, 255, 0.08);
            color: #2563eb;
            border: 1px solid rgba(37, 99, 235, 0.2);
        }

        .badge-omc {
            background: rgba(16, 185, 129, 0.08);
            color: #059669;
            border: 1px solid rgba(5, 150, 105, 0.2);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-sub);
        }

        /* タブ切り替え */
        .tabs {
            display: flex;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            user-select: none;
        }

        .tab.active {
            background: #ffffff;
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
            background: #fff;
        }

        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.04);
        }

        .calc-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        .calc-btn:hover {
            background: var(--accent-hover);
        }

        .calc-btn:active {
            transform: scale(0.99);
        }

        .result-panel {
            margin-top: 24px;
            padding: 20px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .result-panel.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-size: 11px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .result-value {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .result-subtext {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 8px;
        }

        .diff-positive {
            color: var(--success-color);
            font-weight: 700;
        }

        .diff-negative {
            color: var(--error-color);
            font-weight: 700;
        }

        .panel-content {
            display: none;
        }

        .panel-content.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="badges">
            <span class="badge badge-atcoder">AtCoder</span>
            <span class="badge badge-omc">Online Math Contest</span>
        </div>
        <h1>Rating Estimator</h1>
        <p>Official Algorithm & Simulation Tool</p>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab(0)">目標パフォーマンス</div>
        <div class="tab" onclick="switchTab(1)">新レート予測</div>
    </div>

    <!-- モード1: 目標レートから必要パフォーマンスを計算 -->
    <div id="panel-0" class="panel-content active">
        <div class="form-group">
            <label for="current-rating-1">現在のレーティング</label>
            <input type="number" id="current-rating-1" placeholder="例: 1200" value="1200">
        </div>
        <div class="form-group">
            <label for="target-rating">目標のレーティング</label>
            <input type="number" id="target-rating" placeholder="例: 1400" value="1400">
        </div>
        <div class="form-group">
            <label for="rated-count-1">これまでの参加回数</label>
            <input type="number" id="rated-count-1" placeholder="例: 10" value="10">
        </div>
        <button class="calc-btn" onclick="calcRequiredPerformance()">必要パフォーマンスを計算</button>

        <div id="result-1" class="result-panel">
            <div class="result-title">必要パフォーマンス</div>
            <div id="res-val-1" class="result-value">---</div>
            <div id="res-sub-1" class="result-subtext"></div>
        </div>
    </div>

    <!-- モード2: パフォーマンスから新レートを計算 -->
    <div id="panel-1" class="panel-content">
        <div class="form-group">
            <label for="current-rating-2">現在のレーティング</label>
            <input type="number" id="current-rating-2" placeholder="例: 1200" value="1200">
        </div>
        <div class="form-group">
            <label for="input-perf">今回のパフォーマンス</label>
            <input type="number" id="input-perf" placeholder="例: 1500" value="1500">
        </div>
        <div class="form-group">
            <label for="rated-count-2">これまでの参加回数</label>
            <input type="number" id="rated-count-2" placeholder="例: 10" value="10">
        </div>
        <button class="calc-btn" onclick="calcNewRating()">新しいレートを計算</button>

        <div id="result-2" class="result-panel">
            <div class="result-title">新しいレーティング</div>
            <div id="res-val-2" class="result-value">---</div>
            <div id="res-sub-2" class="result-subtext"></div>
        </div>
    </div>
</div>

<script>
    function switchTab(index) {
        const tabs = document.querySelectorAll('.tab');
        const panels = document.querySelectorAll('.panel-content');
        
        tabs.forEach((tab, i) => {
            if (i === index) {
                tab.classList.add('active');
                panels[i].classList.add('active');
            } else {
                tab.classList.remove('active');
                panels[i].classList.remove('active');
            }
        });
    }

    // --- koba-e964氏のatcoder-rating-estimator (ac-predictor) 準拠の厳密な計算ロジック ---

    // 補助関数 f(n)
    function f(n) {
        let pow1 = 1;
        let pow2 = 1;
        let numerator = 0;
        let denominator = 0;
        for (let i = 0; i < n; ++i) {
            pow1 *= 0.81;
            pow2 *= 0.9;
            numerator += pow1;
            denominator += pow2;
        }
        return Math.sqrt(numerator) / denominator;
    }

    const finf = f(400); // 収束値

    // 補正項計算関数
    function calcF(n) {
        return (f(n) - finf) / (f(1) - finf) * 1200.0;
    }

    // レートから内部評価値（Unpositivized Rating）への変換
    function unpositivize(rating, n) {
        let unpos;
        if (rating <= 400.0) {
            unpos = 400.0 + 400.0 * Math.log(rating / 400.0);
        } else {
            unpos = rating;
        }
        return unpos + calcF(n);
    }

    // 内部評価値からレーティングへの変換
    function positivize(unpos, n) {
        let rating = unpos - calcF(n);
        if (rating <= 400.0) {
            return 400.0 * Math.exp((rating - 400.0) / 400.0);
        } else {
            return rating;
        }
    }

    // 新しいレーティングを計算する関数 (perf: 今回のパフォーマンス, currentRating: 現在のレート, n: これまでの参加回数)
    function simulateNewRating(currentRating, perf, n) {
        const ratedMatches = n + 1;
        const unposCurrent = unpositivize(currentRating, n);

        // 過去のパフォーマンスの重み付き累積を復元・加算
        let pow1 = 1;
        let pow2 = 1;
        let numerator = 0;
        let denominator = 0;

        // 今回のコンテスト分 (i = 0)
        pow1 *= 0.81;
        pow2 *= 0.9;
        numerator += Math.pow(2.0, perf / 800.0) * pow1;
        denominator += pow2;

        // 過去のコンテスト分 (簡易的に現在の内部評価値から逆算した仮想パフォーマンスを分配)
        let pastPerfVal = Math.pow(2.0, unposCurrent / 800.0);
        for (let i = 1; i < ratedMatches; ++i) {
            pow1 *= 0.81;
            pow2 *= 0.9;
            numerator += pastPerfVal * pow1;
            denominator += pow2;
        }

        const unposNew = Math.log2(numerator / denominator) * 800.0 - calcF(ratedMatches);
        return Math.round(positivize(unposNew + calcF(ratedMatches), ratedMatches));
    }

    // --- UI連動関数 ---

    function calcRequiredPerformance() {
        const current = parseFloat(document.getElementById('current-rating-1').value);
        const target = parseFloat(document.getElementById('target-rating').value);
        const n = parseInt(document.getElementById('rated-count-1').value);

        if (isNaN(current) || isNaN(target) || isNaN(n)) {
            alert('すべての項目に正しい数値を入力してください。');
            return;
        }

        // 二分法で必要パフォーマンスを正確に逆算
        let low = -2000;
        let high = 8000;
        for (let i = 0; i < 100; i++) {
            let mid = (low + high) / 2;
            let simulated = simulateNewRating(current, mid, n);
            if (simulated >= target) {
                high = mid;
            } else {
                low = mid;
            }
        }
        const requiredPerf = Math.round((low + high) / 2);

        const resultPanel = document.getElementById('result-1');
        const resVal = document.getElementById('res-val-1');
        const resSub = document.getElementById('res-sub-1');

        resVal.textContent = requiredPerf;
        let diff = target - current;
        resSub.innerHTML = `現在のレートから <span class="${diff >= 0 ? 'diff-positive' : 'diff-negative'}">${diff >= 0 ? '+' + diff : diff}</span> 到達するために必要なパフォーマンスです。`;
        resultPanel.classList.add('show');
    }

    function calcNewRating() {
        const current = parseFloat(document.getElementById('current-rating-2').value);
        const perf = parseFloat(document.getElementById('input-perf').value);
        const n = parseInt(document.getElementById('rated-count-2').value);

        if (isNaN(current) || isNaN(perf) || isNaN(n)) {
            alert('すべての項目に正しい数値を入力してください。');
            return;
        }

        const newRating = simulateNewRating(current, perf, n);
        const diff = newRating - current;

        const resultPanel = document.getElementById('result-2');
        const resVal = document.getElementById('res-val-2');
        const resSub = document.getElementById('res-sub-2');

        resVal.textContent = newRating;
        resSub.innerHTML = `変動予測: <span class="${diff >= 0 ? 'diff-positive' : 'diff-negative'}">${diff >= 0 ? '+' + diff : diff}</span> (パフォーマンス: ${perf})`;
        resultPanel.classList.add('show');
    }
</script>

</body>
</html>
