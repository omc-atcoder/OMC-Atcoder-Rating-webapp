<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rating & Performance Calculator (AtCoder / OMC)</title>
    <style>
        :root {
            --bg-color: #fafafa;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-sub: #666666;
            --border-color: #e0e0e0;
            --accent-color: #111111;
            --accent-hover: #333333;
            --error-color: #d32f2f;
            --success-color: #2e7d32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-sub);
        }

        .tabs {
            display: flex;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 3px;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sub);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            user-select: none;
        }

        .tab.active {
            background: #ffffff;
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-sub);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .calc-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .calc-btn:hover {
            background: var(--accent-hover);
        }

        .result-panel {
            margin-top: 24px;
            padding: 20px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .result-panel.show {
            display: block;
        }

        .result-title {
            font-size: 12px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .result-value {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .result-subtext {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 8px;
        }

        .diff-positive {
            color: var(--success-color);
        }

        .diff-negative {
            color: var(--error-color);
        }

        .panel-content {
            display: none;
        }

        .panel-content.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Rating Calculator</h1>
        <p>AtCoder & OMC Official Logic</p>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab(0)">目標パフォーマンス</div>
        <div class="tab" onclick="switchTab(1)">新レート予測</div>
    </div>

    <!-- モード1: 目標レートから必要パフォーマンスを計算 -->
    <div id="panel-0" class="panel-content active">
        <div class="form-group">
            <label for="current-rating-1">現在のレーティング</label>
            <input type="number" id="current-rating-1" placeholder="例: 1200" value="1200">
        </div>
        <div class="form-group">
            <label for="target-rating">目標のレーティング</label>
            <input type="number" id="target-rating" placeholder="例: 1400" value="1400">
        </div>
        <div class="form-group">
            <label for="rated-count-1">これまでの参加回数</label>
            <input type="number" id="rated-count-1" placeholder="例: 10" value="10">
        </div>
        <button class="calc-btn" onclick="calcRequiredPerformance()">必要パフォーマンスを計算</button>

        <div id="result-1" class="result-panel">
            <div class="result-title">必要パフォーマンス</div>
            <div id="res-val-1" class="result-value">---</div>
            <div id="res-sub-1" class="result-subtext"></div>
        </div>
    </div>

    <!-- モード2: パフォーマンスから新レートを計算 -->
    <div id="panel-1" class="panel-content">
        <div class="form-group">
            <label for="current-rating-2">現在のレーティング</label>
            <input type="number" id="current-rating-2" placeholder="例: 1200" value="1200">
        </div>
        <div class="form-group">
            <label for="input-perf">今回のパフォーマンス</label>
            <input type="number" id="input-perf" placeholder="例: 1500" value="1500">
        </div>
        <div class="form-group">
            <label for="rated-count-2">これまでの参加回数</label>
            <input type="number" id="rated-count-2" placeholder="例: 10" value="10">
        </div>
        <button class="calc-btn" onclick="calcNewRating()">新しいレートを計算</button>

        <div id="result-2" class="result-panel">
            <div class="result-title">新しいレーティング</div>
            <div id="res-val-2" class="result-value">---</div>
            <div id="res-sub-2" class="result-subtext"></div>
        </div>
    </div>
</div>

<script>
    function switchTab(index) {
        const tabs = document.querySelectorAll('.tab');
        const panels = document.querySelectorAll('.panel-content');
        
        tabs.forEach((tab, i) => {
            if (i === index) {
                tab.classList.add('active');
                panels[i].classList.add('active');
            } else {
                tab.classList.remove('active');
                panels[i].classList.remove('active');
            }
        });
    }

    // --- AtCoder公式仕様に基づく計算ロジック ---

    // F(inf) の定数 (1 / sqrt(19))
    const F_INF = 1.0 / Math.sqrt(19.0);

    // 補正関数 F(k)
    function calcF(k) {
        let sum1 = 0;
        let sum2 = 0;
        for (let i = 1; i <= k; i++) {
            sum1 += Math.pow(0.81, i);
            sum2 += Math.pow(0.9, i);
        }
        return Math.sqrt(sum1) / sum2;
    }

    // 補正値 G(k)
    function calcG(k) {
        const f1 = calcF(1);
        const fk = calcF(k);
        return 1200.0 * (fk - F_INF) / (f1 - F_INF);
    }

    // 最終レート計算 (R_final)
    function getFinalRating(rInner, k) {
        const gK = calcG(k);
        let rCorrected = rInner - gK;
        
        if (rCorrected <= 400) {
            return 400.0 * Math.exp((rCorrected - 400.0) / 400.0);
        } else {
            return rCorrected;
        }
    }

    // 新レートを計算するメイン関数
    function simulateNewRating(currentRating, perf, n) {
        const nextN = n + 1;
        
        // 現在のレートから逆算した仮想的な過去の内部レート累積値を推定
        // （簡易的に、過去のパフォーマンスがすべて一定であると仮定）
        let targetCorrected = currentRating;
        let targetRInner = targetCorrected <= 400 ? 400.0 + 400.0 * Math.log(currentRating / 400.0) : currentRating;
        let oldRInner = targetRInner + calcG(n);
        
        // 新しい内部レートの計算 (直近が perf, 過去が oldRInner の加重平均)
        let weightSum = 0;
        let valSum = 0;
        
        for (let i = 1; i <= n; i++) {
            let w = Math.pow(0.9, i);
            weightSum += w;
            valSum += oldRInner * w; // 過去の平均パフォーマンスとして近似
        }
        
        // 今回のパフォーマンスを追加 (最新は i = 1 の位置、あるいは式に合わせる)
        // ここでは最新のコンテストの重みが 0.9^1 になるように調整
        // 画像の式: R_inner = sum(P_i * 0.9^i) / sum(0.9^i)
        // 次回は参加回数が n+1 になるため、過去分をシフトしつつ今回分を入れる
        
        let newWeightSum = 0;
        let newValSum = perf * 0.9; // 今回 (i=1)
        newWeightSum += 0.9;
        
        for (let i = 1; i <= n; i++) {
            let w = Math.pow(0.9, i + 1);
            newWeightSum += w;
            valSum += oldRInner * w; // 簡易近似
        }
        
        // 厳密な加重平均の再構築
        // 今回のパフォーマンスを perf (重み 0.9)、過去を oldRInner (重み合計に対する残り)
        let totalWeight = 0;
        let totalWeightedPerf = perf * 0.9;
        totalWeight += 0.9;
        
        for (let i = 1; i <= n; i++) {
            let w = Math.pow(0.9, i + 1);
            totalWeightedPerf += oldRInner * w;
            totalWeight += w;
        }
        
        let newRInner = totalWeightedPerf / totalWeight;
        let finalVal = getFinalRating(newRInner, nextN);
        
        return Math.round(finalVal);
    }

    // --- UI連動関数 ---

    function calcRequiredPerformance() {
        const current = parseFloat(document.getElementById('current-rating-1').value);
        const target = parseFloat(document.getElementById('target-rating').value);
        const n = parseInt(document.getElementById('rated-count-1').value);

        if (isNaN(current) || isNaN(target) || isNaN(n)) {
            alert('すべての項目に正しい数値を入力してください。');
            return;
        }

        // 二分法で目標レートに到達するパフォーマンスを逆算
        let low = -2000;
        let high = 6000;
        for (let i = 0; i < 100; i++) {
            let mid = (low + high) / 2;
            let simulated = simulateNewRating(current, mid, n);
            if (simulated >= target) {
                high = mid;
            } else {
                low = mid;
            }
        }
        const requiredPerf = Math.round((low + high) / 2);

        const resultPanel = document.getElementById('result-1');
        const resVal = document.getElementById('res-val-1');
        const resSub = document.getElementById('res-sub-1');

        resVal.textContent = requiredPerf;
        let diff = target - current;
        resSub.innerHTML = `現在のレートから <span class="${diff >= 0 ? 'diff-positive' : 'diff-negative'}">${diff >= 0 ? '+' + diff : diff}</span> 到達するために必要なパフォーマンスです。`;
        resultPanel.classList.add('show');
    }

    function calcNewRating() {
        const current = parseFloat(document.getElementById('current-rating-2').value);
        const perf = parseFloat(document.getElementById('input-perf').value);
        const n = parseInt(document.getElementById('rated-count-2').value);

        if (isNaN(current) || isNaN(perf) || isNaN(n)) {
            alert('すべての項目に正しい数値を入力してください。');
            return;
        }

        const newRating = simulateNewRating(current, perf, n);
        const diff = newRating - current;

        const resultPanel = document.getElementById('result-2');
        const resVal = document.getElementById('res-val-2');
        const resSub = document.getElementById('res-sub-2');

        resVal.textContent = newRating;
        resSub.innerHTML = `変動: <span class="${diff >= 0 ? 'diff-positive' : 'diff-negative'}">${diff >= 0 ? '+' + diff : diff}</span> (パフォーマンス: ${perf})`;
        resultPanel.classList.add('show');
    }
</script>

</body>
</html>
